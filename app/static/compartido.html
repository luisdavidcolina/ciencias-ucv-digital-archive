<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Documento compartido — Archivo Ciencias UCV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0" crossorigin="anonymous">
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="icon" type="image/x-icon" href="/static/assets/icons/favicon.ico">
</head>
<body data-page="compartido"><script>try{var _t=localStorage.getItem('ds_theme');if(_t&&_t!=='default')document.body.classList.add(_t);}catch(e){}</script>

<div class="ds-compartido-wrap">
  <header class="ds-compartido-cab">
    <img src="/static/logo.png" alt="Facultad de Ciencias UCV" class="ds-compartido-logo">
    <span class="ds-compartido-sello"><i class="fas fa-link"></i> Documento compartido</span>
  </header>

  <!-- SI-170: encabezado de nivel 1 estable, presente en todos los estados
       (carga, aviso y documento), no solo cuando la carga tiene éxito. -->
  <h1 class="sr-only">Documento compartido — Archivo Institucional Digital, Facultad de Ciencias UCV</h1>

  <main id="contenido-principal" class="ds-compartido-caja" tabindex="-1">
    <div class="ds-chart-empty"><i class="fas fa-circle-notch fa-spin"></i><span>Cargando…</span></div>
  </main>

  <footer class="ds-compartido-pie">
    Archivo Institucional Digital · Facultad de Ciencias, Universidad Central de Venezuela ·
    <a href="https://www.ciens.ucv.ve/" target="_blank" rel="noopener">Sitio de la Facultad</a>
  </footer>
</div>

<script src="/static/js/core/app-theme.js"></script>
<script>
// El token viaja en la ruta (/compartido/<token>), no en la query: así no se
// queda en los registros de referer de terceros al pulsar un enlace saliente.
// Escapado propio: esta página no carga app.js a proposito, porque app.js
// exige sesion y redirige al login — y aqui no hay sesion por diseño.
function esc(v) {
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

const TOKEN = decodeURIComponent(location.pathname.split('/compartido/')[1] || '');
const caja  = document.getElementById('contenido-principal');

function aviso(icono, titulo, detalle, conReintentar) {
  // VI-071: sin salida ni contacto, un enlace caducado dejaba 600px de tarjeta
  // vacía (la caja hereda flex:1 de .ds-compartido-wrap para el caso normal,
  // con documento). Aquí se encoge al contenido y se ofrecen dos salidas
  // reales: el catálogo público (no exige sesión) y el correo de soporte que
  // ya usa /static/ayuda.html.
  caja.parentElement.classList.add('is-aviso');
  caja.innerHTML =
    '<div class="ds-compartido-aviso">' +
      '<i class="fas ' + icono + '"></i>' +
      '<h2>' + esc(titulo) + '</h2>' +
      '<p>' + esc(detalle) + '</p>' +
      '<div class="ds-compartido-aviso-acciones">' +
        (conReintentar
          ? '<button type="button" class="btn btn-primary" id="btn-reintentar"><i class="fas fa-rotate-right mr-1"></i>Reintentar</button>'
          : '') +
        '<a class="btn btn-outline-secondary" href="/archivo"><i class="fas fa-magnifying-glass mr-1"></i>Ir al catálogo público</a>' +
        '<a class="btn btn-outline-secondary" href="mailto:informatica@ciens.ucv.ve"><i class="fas fa-envelope mr-1"></i>Escribir al Archivo</a>' +
      '</div>' +
    '</div>';
  if (conReintentar) {
    document.getElementById('btn-reintentar').addEventListener('click', cargar);
  }
}

function formatearCaducidad(iso) {
  if (!iso) return '';
  const f = new Date(iso);
  if (isNaN(f.getTime())) return '';
  return f.toLocaleString('es-VE', {
    day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit',
  });
}

function fila(etiqueta, valor) {
  if (!valor) return '';
  return '<div class="ds-compartido-fila"><dt>' + esc(etiqueta) + '</dt>' +
         '<dd>' + esc(valor) + '</dd></div>';
}

async function cargar() {
  if (!TOKEN) {
    aviso('fa-triangle-exclamation', 'Enlace incompleto',
          'La dirección no incluye un identificador de documento.');
    return;
  }
  caja.parentElement.classList.remove('is-aviso');
  caja.innerHTML = '<div class="ds-chart-empty"><i class="fas fa-circle-notch fa-spin"></i><span>Cargando…</span></div>';

  let res;
  try {
    // SI-169: sin límite de tiempo, una petición colgada dejaba el disco
    // girando indefinidamente. 15s y un aviso con opción de reintentar.
    res = await fetch('/api/compartido/' + encodeURIComponent(TOKEN), {
      signal: AbortSignal.timeout(15000),
    });
  } catch (e) {
    const esTimeout = e && (e.name === 'TimeoutError' || e.name === 'AbortError');
    aviso('fa-plug-circle-xmark', esTimeout ? 'El servidor está tardando demasiado' : 'Sin conexión',
          esTimeout ? 'La consulta no obtuvo respuesta a tiempo. Puede intentarlo de nuevo.'
                    : 'No se pudo contactar con el servidor. Inténtelo de nuevo.',
          true);
    return;
  }
  if (res.status === 404) {
    aviso('fa-clock-rotate-left', 'Enlace caducado o no válido',
          'Los enlaces de consulta tienen una vigencia limitada. Solicite uno nuevo a quien se lo compartió.');
    return;
  }
  if (!res.ok) {
    aviso('fa-triangle-exclamation', 'No se pudo abrir el documento',
          'El servidor respondió con un error. Inténtelo más tarde.', true);
    return;
  }

  const datos = await res.json();
  const d = datos.documento || {};
  const descarga = d.tiene_archivo
    ? '<a class="btn btn-primary" href="/api/compartido/' + encodeURIComponent(TOKEN) +
      '/archivo" target="_blank" rel="noopener">' +
      '<i class="fas fa-file-arrow-down mr-1"></i>Ver el documento digitalizado</a>'
    : '<div class="ds-compartido-sinarchivo"><i class="fas fa-box-archive mr-1"></i>' +
      'Este documento no está digitalizado; se conserva en soporte físico.</div>';

  caja.innerHTML =
    '<span class="ds-compartido-modulo">' + esc(datos.modulo) + '</span>' +
    '<h2 class="ds-compartido-titulo">' + esc(d.titulo || 'Documento') + '</h2>' +
    '<dl class="ds-compartido-datos">' +
      fila('Tipo documental', d.tipo) +
      fila('Autor / Emisor', d.autor) +
      fila('Fecha del documento', d.fecha) +
      fila('Soporte', d.soporte) +
      fila('Ubicación', d.ubicacion) +
    '</dl>' +
    '<div class="ds-compartido-acciones">' + descarga + '</div>' +
    '<p class="ds-compartido-nota"><i class="fas fa-shield-halved mr-1"></i>' +
    'Consulta autorizada mediante enlace temporal. Su acceso queda registrado en la auditoría del archivo.' +
    (datos.caduca
      ? '<br><i class="fas fa-clock mr-1"></i>Este enlace caduca el ' + esc(formatearCaducidad(datos.caduca)) + '.'
      : '') +
    '</p>';
}

cargar();
</script>
</body>
</html>
