<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archivo Institucional - UCV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.bootstrap4.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
  <link rel="icon" type="image/x-icon" href="/static/assets/icons/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/assets/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="/static/assets/icons/site.webmanifest">
</head>
<body class="hold-transition sidebar-mini" data-page="archivo"><script>try{var _t=localStorage.getItem('ds_theme');if(_t&&_t!=='default')document.body.classList.add(_t);}catch(e){}</script>

  <!-- Barra superior: definida en app-shell.js. -->
  <div id="app-shell-navbar"></div>


  <!-- Menú lateral: se renderiza desde app-shell.js, que es donde
       vive su única definición. -->
  <div id="app-shell-sidebar"></div>
  <script src="/static/js/core/app-shell.js"></script>


  <!-- CONTENT WRAPPER -->
  <div class="content-wrapper">
    <section id="tab-archivo" class="app-tab-section p-4">
      <div class="row">
        <!-- Filtros: BA-078, va después de los resultados en el DOM (el
             campo de búsqueda es lo primero que se usa por teclado) y se
             reordena visualmente con las clases order-md-*. -->
        <div class="col-md-3 order-md-2">
          <div class="card card-secondary">
            <div class="card-header"><h3 class="card-title">Filtros</h3></div>
            <div class="card-body">
              <div id="ext_filters_acc">
                <div class="card mb-1">
                  <div class="card-header p-2" id="heading-arch-type">
                    <button class="btn btn-link btn-block text-left text-primary font-weight-bold" type="button" data-toggle="collapse" data-target="#collapse-arch-type" aria-expanded="true" aria-controls="collapse-arch-type">Tipología</button>
                  </div>
                  <div id="collapse-arch-type" class="collapse show">
                    <div class="card-body p-2">
                      <select id="choice-archivo-doc-type" multiple aria-label="Filtrar por tipología documental" placeholder="Buscar tipología..."></select>
                    </div>
                  </div>
                </div>
                <div class="card mb-1">
                  <div class="card-header p-2" id="heading-arch-date">
                    <button class="btn btn-link btn-block text-left text-primary font-weight-bold" type="button" data-toggle="collapse" data-target="#collapse-arch-date" aria-expanded="false" aria-controls="collapse-arch-date">Fecha</button>
                  </div>
                  <div id="collapse-arch-date" class="collapse">
                    <div class="card-body p-2">
                      <div class="ds-date-chips mb-2" role="radiogroup" aria-label="Rango de fecha">
                        <button class="ds-date-chip active" data-module="archivo" data-preset="all" role="radio" aria-checked="true">Todo</button>
                        <button class="ds-date-chip" data-module="archivo" data-preset="year" role="radio" aria-checked="false"><i class="fas fa-hashtag" aria-hidden="true"></i> Año</button>
                        <button class="ds-date-chip" data-module="archivo" data-preset="custom" role="radio" aria-checked="false"><i class="fas fa-sliders-h" aria-hidden="true"></i> Rango</button>
                      </div>
                      <div id="year-panel-archivo" style="display:none;" class="mb-1">
                        <label for="year-select-archivo" class="sr-only">Año</label>
                        <select id="year-select-archivo" class="form-control form-control-sm">
                          <option value="">Seleccionar año…</option>
                        </select>
                      </div>
                      <div id="range-panel-archivo" style="display:none;" class="mb-1">
                        <div class="input-group input-group-sm">
                          <div class="input-group-prepend">
                            <span class="input-group-text" style="background:#f4f9ff;"><i class="fas fa-calendar-alt text-primary" aria-hidden="true"></i></span>
                          </div>
                          <label for="fp-archivo-range" class="sr-only">Rango de fechas (desde – hasta)</label>
                          <input type="text" id="fp-archivo-range" class="form-control form-control-sm" placeholder="Desde → Hasta" readonly style="cursor:pointer;background:#fff;">
                          <div class="input-group-append">
                            <button class="btn btn-outline-secondary btn-sm" type="button" id="fp-archivo-clear" aria-label="Volver a Todo"><i class="fas fa-times" aria-hidden="true"></i></button>
                          </div>
                        </div>
                      </div>
                      <div id="fp-archivo-label" class="ds-date-active-label mt-1"></div>
                    </div>
                  </div>
                </div>
                <div class="card mb-1">
                  <div class="card-header p-2" id="heading-arch-tesauro">
                    <button class="btn btn-link btn-block text-left text-primary font-weight-bold" type="button" data-toggle="collapse" data-target="#collapse-arch-tesauro" aria-expanded="false" aria-controls="collapse-arch-tesauro">Palabras Clave</button>
                  </div>
                  <div id="collapse-arch-tesauro" class="collapse">
                    <div class="card-body p-2">
                      <select id="choice-archivo-tesauro" multiple aria-label="Filtrar por palabras clave" placeholder="Buscar palabras clave..."></select>
                    </div>
                  </div>
                </div>
                <div class="card mb-1">
                  <div class="card-header p-2" id="heading-arch-soporte">
                    <button class="btn btn-link btn-block text-left text-primary font-weight-bold" type="button" data-toggle="collapse" data-target="#collapse-arch-soporte" aria-expanded="false" aria-controls="collapse-arch-soporte">Soporte</button>
                  </div>
                  <div id="collapse-arch-soporte" class="collapse">
                    <div class="card-body p-2">
                      <label for="soporte_archivo" class="sr-only">Filtrar por soporte</label>
                      <select id="soporte_archivo" class="form-control form-control-sm" aria-label="Filtrar por soporte">
                        <option value="">Todos los soportes</option>
                        <option value="Físico">Físico</option>
                        <option value="Digital">Digital</option>
                        <option value="Digitalizado">Digitalizado</option>
                      </select>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <!-- Facetas dinámicas (se rellena desde archive.js) -->
          <div id="archivo-facets-panel"></div>

          <div class="card card-secondary mt-3">
            <div class="card-header"><h3 class="card-title">Vista</h3></div>
            <div class="card-body p-3">
              <div class="form-group mb-2">
                <label class="text-muted mb-1">Criterio de orden</label>
                <select id="sort_archivo" class="form-control form-control-sm" aria-label="Ordenar resultados">
                  <option value="Alfabético (A-Z)">Alfabético (A-Z)</option>
                  <option value="Alfabético (Z-A)">Alfabético (Z-A)</option>
                  <option value="Más recientes primero">Más recientes primero</option>
                  <option value="Más antiguos primero">Más antiguos primero</option>
                  <option value="Relevancia">Relevancia (con texto de búsqueda)</option>
                </select>
              </div>
              <div class="form-group mb-0">
                <label class="text-muted mb-1">Resultados por página</label>
                <select id="rpp_archivo" class="form-control form-control-sm" aria-label="Resultados por página">
                  <option value="5">5 por página</option>
                  <option value="10" selected>10 por página</option>
                  <option value="20">20 por página</option>
                  <option value="50">50 por página</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <!-- Resultados: primero en el DOM (BA-078), aunque visualmente sigue
             a la derecha por order-md-1. -->
        <div class="col-md-9 order-md-1">
          <div class="ds-search-bar">
            <div class="input-group">
              <label for="search_archivo" class="sr-only">Buscar por título, autor, resumen o palabras clave</label>
              <input type="text" id="search_archivo" class="form-control ds-search-input" placeholder="Título, autor, resumen, palabras clave…">
              <div class="input-group-append">
                <button id="btn_s_archivo" class="btn ds-btn-primary ds-search-action-btn" aria-label="Buscar"><i class="fas fa-search" aria-hidden="true"></i></button>
                <button id="btn_clear_archivo" class="btn btn-outline-secondary ds-search-action-btn" aria-label="Limpiar filtros"><i class="fas fa-eraser" aria-hidden="true"></i></button>
                <button id="download_archivo_xls" class="btn ds-btn-export ds-search-action-btn" aria-label="Exportar XLS"><i class="fas fa-file-excel" aria-hidden="true"></i></button>
              </div>
            </div>
          </div>
          <div class="ds-results-header">
            <h2 class="ds-results-title">Resultados de Búsqueda</h2>
            <span id="count-archivo-results" class="ds-pagination-info" role="status" aria-live="polite">0 Registros</span>
          </div>
          <!-- BA-072: `role="list"` se aplica/retira desde archive.js según el
               contenido real — el esqueleto de carga y el estado vacío no son
               `listitem`, y prometer esa estructura mientras están presentes
               incumple lo que ya documenta CLAUDE.md sobre esta violación. -->
          <div id="list_archivo"></div>
          <div id="archivo-pagination"></div>
        </div>
      </div>
    </section>
  </div>

  <!-- Modal Documento -->
  <div id="doc-modal" class="modal fade ds-doc-modal" tabindex="-1" role="dialog" aria-hidden="true" aria-labelledby="modal-doc-title" aria-modal="true">
    <div class="modal-dialog modal-lg" role="document">
      <div class="modal-content">
        <div class="modal-body p-4">
          <div class="ds-doc-modal-head mb-3">
            <i class="fas fa-file-alt" aria-hidden="true"></i>
            <h4 id="modal-doc-title" class="m-0 text-primary font-weight-bold">Detalle de Documento</h4>
          </div>
          <div class="ds-doc-modal-grid">
            <div class="ds-doc-panel ds-doc-thumb-panel">
              <h5 class="font-weight-bold text-primary mb-2">Miniatura</h5>
              <div class="ds-doc-thumb">
                <i id="modal-doc-thumb-icon" class="fas fa-file-alt" aria-hidden="true"></i>
                <span id="modal-doc-thumb-badge" class="ds-doc-thumb-badge"></span>
              </div>
            </div>
            <div class="ds-doc-panel">
              <h5 class="font-weight-bold text-primary mb-2">Metadata</h5>
              <div id="modal-doc-meta-container"></div>
            </div>
            <div class="ds-doc-panel" style="grid-column:span 2;">
              <h5 class="font-weight-bold text-primary mb-2">Descripción</h5>
              <p id="modal-doc-abstract" class="ds-doc-abstract text-muted">Sin resumen disponible.</p>
            </div>
          </div>
          <!-- Visor de Documento Digitalizado -->
          <div id="modal-doc-viewer-section" class="d-none mt-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h5 class="font-weight-bold text-primary mb-0"><i class="fas fa-file-pdf mr-2" aria-hidden="true"></i>Visor de Documento</h5>
              <button type="button" onclick="closeDocViewer()" class="btn btn-sm btn-outline-secondary"><i class="fas fa-times mr-1" aria-hidden="true"></i>Cerrar Visor</button>
            </div>
            <div style="border:1px solid #dee2e6;border-radius:8px;overflow:hidden;background:#f8f9fa;">
              <iframe id="modal-doc-iframe" src="" title="Vista previa del documento"
                style="width:100%;height:min(70vh,520px);border:none;display:block;"
                sandbox="allow-same-origin allow-scripts allow-popups" referrerpolicy="no-referrer"></iframe>
            </div>
          </div>
        </div>
        <div class="modal-footer border-top-0 d-flex justify-content-end p-3">
          <button type="button" class="btn btn-secondary" data-dismiss="modal" onclick="closeDocViewer()">Cerrar</button>
          <button id="btn-modal-view" type="button" class="btn btn-outline-info"><i class="fas fa-eye mr-1" aria-hidden="true"></i>Ver</button>
          <button id="btn-modal-edit" type="button" class="btn btn-outline-warning d-none" aria-label="Editar documento"><i class="fas fa-pen" aria-hidden="true"></i></button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
  <script src="/static/js/core/app-core.js"></script>
  <script src="/static/js/archive/archive.js"></script>
  <script src="/static/js/core/app-choices.js"></script>
  <script src="/static/js/core/app-theme.js"></script>
  <script src="/static/js/core/app.js"></script>
  <link rel="stylesheet" href="/static/styles/ai-widget.css">
  <script src="/static/js/ai/ai-widget.js" defer></script>
</body>
</html>
