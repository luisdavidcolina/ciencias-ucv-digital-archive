<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RRHH - Archivo Digital UCV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.bootstrap4.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="icon" type="image/x-icon" href="/static/assets/icons/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/assets/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="/static/assets/icons/site.webmanifest">
</head>
<body class="hold-transition sidebar-mini" data-page="rrhh"><script>try{var _t=localStorage.getItem('ds_theme');if(_t&&_t!=='default')document.body.classList.add(_t);var _dm=localStorage.getItem('ds_dark_mode')||'auto';if(_dm==='dark'||(_dm==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.body.classList.add('dark-mode');if(localStorage.getItem('ds_density')==='compact')document.body.classList.add('ds-density-compact');}catch(e){}</script>

  <!-- Barra superior: definida en app-shell.js. -->
  <div id="app-shell-navbar"></div>


  <!-- Menú lateral: se renderiza desde app-shell.js, que es donde
       vive su única definición. -->
  <div id="app-shell-sidebar"></div>
  <script src="/static/js/core/app-shell.js"></script>


  <!-- CONTENT WRAPPER -->
  <div class="content-wrapper">
    <section id="tab-rrhh" class="app-tab-section p-4">
      <h1 class="sr-only">Búsqueda de Recursos Humanos</h1>
      <div class="row">
        <div class="col-12">
          <div class="ds-breadcrumb-wrapper">
            <div class="ds-breadcrumb">Archivo Digital / Recursos Humanos</div>
          </div>
        </div>
      </div>
      <div class="row">
        <!-- Filtros -->
        <div class="col-md-3">
          <div class="card card-secondary">
            <div class="card-header"><h2 class="card-title">Filtros</h2></div>
            <div class="card-body">
              <div class="accordion" id="rrhh_filters_acc">
                <div class="card mb-1">
                  <div class="card-header p-2" id="heading-rh-type">
                    <h3 class="m-0"><button class="btn btn-link btn-block text-left text-primary font-weight-bold" type="button" data-toggle="collapse" data-target="#collapse-rh-type" aria-expanded="true" aria-controls="collapse-rh-type">Tipología</button></h3>
                  </div>
                  <div id="collapse-rh-type" class="collapse show" data-parent="#rrhh_filters_acc">
                    <div class="card-body p-2">
                      <select id="choice-rrhh-doc-type" multiple aria-label="Filtrar por tipo de documento" placeholder="Buscar tipo..."></select>
                    </div>
                  </div>
                </div>
                <div class="card mb-1">
                  <div class="card-header p-2" id="heading-rh-date">
                    <h3 class="m-0"><button class="btn btn-link btn-block text-left text-primary font-weight-bold" type="button" data-toggle="collapse" data-target="#collapse-rh-date" aria-expanded="false" aria-controls="collapse-rh-date">Fecha de ingreso</button></h3>
                  </div>
                  <div id="collapse-rh-date" class="collapse" data-parent="#rrhh_filters_acc">
                    <div class="card-body p-2">
                      <div class="ds-date-chips mb-2">
                        <button class="ds-date-chip active" data-module="rrhh" data-preset="all">Todo</button>
                        <button class="ds-date-chip" data-module="rrhh" data-preset="year"><i class="fas fa-hashtag" aria-hidden="true"></i> Año</button>
                        <button class="ds-date-chip" data-module="rrhh" data-preset="custom"><i class="fas fa-sliders-h" aria-hidden="true"></i> Rango</button>
                      </div>
                      <div id="year-panel-rrhh" style="display:none;" class="mb-1">
                        <select id="year-select-rrhh" class="form-control form-control-sm">
                          <option value="">Seleccionar año…</option>
                        </select>
                      </div>
                      <div id="range-panel-rrhh" style="display:none;" class="mb-1">
                        <div class="input-group input-group-sm">
                          <div class="input-group-prepend">
                            <span class="input-group-text" style="background:#f4f9ff;"><i class="fas fa-calendar-alt text-primary" aria-hidden="true"></i></span>
                          </div>
                          <input type="text" id="fp-rrhh-range" class="form-control form-control-sm" placeholder="Desde → Hasta" readonly style="cursor:pointer;background:#fff;" aria-label="Rango de fechas de ingreso">
                          <div class="input-group-append">
                            <button class="btn btn-outline-secondary btn-sm" type="button" id="fp-rrhh-clear" title="Volver a Todo" aria-label="Volver a Todo"><i class="fas fa-times" aria-hidden="true"></i></button>
                          </div>
                        </div>
                      </div>
                      <div id="fp-rrhh-label" class="ds-date-active-label mt-1"></div>
                    </div>
                  </div>
                </div>
                <div class="card mb-1">
                  <div class="card-header p-2" id="heading-rh-estado">
                    <h3 class="m-0"><button class="btn btn-link btn-block text-left text-primary font-weight-bold" type="button" data-toggle="collapse" data-target="#collapse-rh-estado" aria-expanded="false" aria-controls="collapse-rh-estado">Estado</button></h3>
                  </div>
                  <div id="collapse-rh-estado" class="collapse" data-parent="#rrhh_filters_acc">
                    <div class="card-body p-2">
                      <select id="choice-rrhh-estado" multiple aria-label="Filtrar por estado laboral" placeholder="Filtrar por estado..."></select>
                    </div>
                  </div>
                </div>
              </div>
              <button id="btn_update_rrhh" class="btn ds-btn-primary w-100 mt-2">Aplicar</button>
            </div>
          </div>
          <!-- Facetas dinámicas RRHH -->
          <div id="rrhh-facets-panel"></div>

          <div class="card card-secondary mt-3">
            <div class="card-header"><h2 class="card-title">Vista</h2></div>
            <div class="card-body p-3">
              <div class="form-group mb-2">
                <label class="text-muted mb-1">Criterio de orden</label>
                <select id="sort_rrhh" class="form-control form-control-sm" aria-label="Ordenar resultados">
                  <option value="Alfabético (A-Z)">Alfabético (A-Z)</option>
                  <option value="Alfabético (Z-A)">Alfabético (Z-A)</option>
                  <option value="Más recientes primero">Más recientes primero</option>
                  <option value="Más antiguos primero">Más antiguos primero</option>
                </select>
              </div>
              <div class="form-group mb-0">
                <label class="text-muted mb-1">Resultados por página</label>
                <select id="rpp_rrhh" class="form-control form-control-sm" aria-label="Resultados por página">
                  <option value="5">5 por página</option>
                  <option value="10" selected>10 por página</option>
                  <option value="20">20 por página</option>
                  <option value="50">50 por página</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <!-- Resultados -->
        <div class="col-md-9">
          <div class="ds-search-bar">
            <div class="input-group">
              <label for="search_rrhh" class="sr-only">Buscar expediente por cédula, nombres o apellidos</label>
              <input type="text" id="search_rrhh" class="form-control ds-search-input" placeholder="Buscar expediente por Cédula, Nombres, Apellidos...">
              <div class="input-group-append">
                <button id="btn_s_rrhh" class="btn ds-btn-primary ds-search-action-btn" title="Buscar" aria-label="Buscar"><i class="fas fa-search" aria-hidden="true"></i></button>
                <button id="btn_clear_rrhh" class="btn btn-outline-secondary ds-search-action-btn" title="Limpiar filtros" aria-label="Limpiar filtros"><i class="fas fa-eraser" aria-hidden="true"></i></button>
                <button id="download_rrhh_xls" class="btn ds-btn-export ds-search-action-btn" title="Exportar XLS" aria-label="Exportar resultados a Excel"><i class="fas fa-file-excel" aria-hidden="true"></i></button>
              </div>
            </div>
          </div>
          <div class="ds-results-header">
            <h2 class="ds-results-title">Resultados de Búsqueda</h2>
            <span id="count-rrhh-results" class="ds-pagination-info" role="status" aria-live="polite">0 Registros</span>
          </div>
          <div id="list_rrhh" role="list"></div>
          <div id="rrhh-pagination"></div>
          <div id="rrhh_pagination_controls" class="d-flex justify-content-between align-items-center mt-3" role="navigation" aria-label="Paginación de personas">
            <button id="btn-rrhh-prev" class="btn btn-outline-secondary btn-sm" aria-label="Página anterior"><i class="fas fa-chevron-left"></i> Anterior</button>
            <span id="info-rrhh-pagination" class="text-muted" style="font-size:0.85rem;" aria-live="polite">Pág 1 de 1</span>
            <button id="btn-rrhh-next" class="btn btn-outline-secondary btn-sm" aria-label="Página siguiente">Siguiente <i class="fas fa-chevron-right"></i></button>
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- Modal Expediente RRHH -->
  <div id="rrhh-person-modal" class="modal fade rrhh-person-modal" tabindex="-1" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="rrhh-person-modal-title">
    <div class="modal-dialog modal-xl" role="document">
      <div class="modal-content" style="border-radius:14px; border:1px solid #d6dbe1; box-shadow:0 18px 40px rgba(16,24,40,0.2);">
        <div class="modal-body p-4" style="max-height:80vh; overflow-y:auto;">
          <div id="rrhh-person-modal-content"></div>
        </div>
        <div class="modal-footer border-top-0 p-3">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Documento (compartido con archive.js via openDocMetadataModal) -->
  <div id="doc-modal" class="modal fade" tabindex="-1" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="modal-doc-title">
    <div class="modal-dialog modal-lg" role="document">
      <div class="modal-content" style="border-radius:14px; border:1px solid #d6dbe1; box-shadow:0 18px 40px rgba(16,24,40,0.2);">
        <div class="modal-body p-4">
          <div class="ds-doc-modal-head mb-3">
            <i class="fas fa-id-card"></i>
            <h4 id="modal-doc-title" class="m-0 text-primary font-weight-bold">Detalle de Documento</h4>
          </div>
          <div class="ds-doc-modal-grid">
            <div class="ds-doc-panel ds-doc-thumb-panel">
              <h5 class="font-weight-bold text-primary mb-2">Tipo</h5>
              <div class="ds-doc-thumb">
                <i id="modal-doc-thumb-icon" class="fas fa-id-card"></i>
                <span id="modal-doc-thumb-badge" class="ds-doc-thumb-badge">N/A</span>
              </div>
            </div>
            <div class="ds-doc-panel">
              <h5 class="font-weight-bold text-primary mb-2">Metadata</h5>
              <div id="modal-doc-meta-container"></div>
            </div>
            <div class="ds-doc-panel" style="grid-column:span 2;">
              <h5 class="font-weight-bold text-primary mb-2">Descripción</h5>
              <p id="modal-doc-abstract" class="ds-doc-abstract text-muted">Sin resumen disponible.</p>
            </div>
          </div>
          <!-- Visor de Documento Digitalizado -->
          <div id="modal-doc-viewer-section" class="d-none mt-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h5 class="font-weight-bold text-primary mb-0"><i class="fas fa-file-pdf mr-2"></i>Visor de Documento</h5>
              <button onclick="closeDocViewer()" class="btn btn-sm btn-outline-secondary"><i class="fas fa-times mr-1"></i>Cerrar Visor</button>
            </div>
            <div style="border:1px solid #dee2e6;border-radius:8px;overflow:hidden;background:#f8f9fa;">
              <iframe id="modal-doc-iframe" src="" title="Visor del documento" style="width:100%;height:520px;border:none;display:block;" allowfullscreen></iframe>
            </div>
          </div>
        </div>
        <div class="modal-footer border-top-0 d-flex justify-content-end p-3">
          <button type="button" class="btn btn-secondary" data-dismiss="modal" onclick="closeDocViewer()">Cerrar</button>
          <button id="btn-modal-view" class="btn btn-outline-info" title="Visualizar"><i class="fas fa-eye mr-1"></i>Ver</button>
          <button id="btn-modal-edit" class="btn btn-outline-warning d-none" title="Editar"><i class="fas fa-pen"></i></button>
          <button id="btn-modal-download" class="btn btn-outline-primary d-none" title="Descargar"><i class="fas fa-download"></i></button>
        </div>
      </div>
    </div>
  </div>

  <style>
    #session-warning-banner { font-family:inherit; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
  <script src="/static/js/core/app-core.js"></script>
  <script src="/static/js/hr/hr.js"></script>
  <script src="/static/js/core/app-choices.js"></script>
  <script src="/static/js/core/app-theme.js"></script>
  <script src="/static/js/core/app.js"></script>
  <link rel="stylesheet" href="/static/styles/ai-widget.css">
  <script src="/static/js/ai/ai-widget.js" defer></script>
</body>
</html>
